[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-dss"
version = "0.1.0"
description = "Sistema pessoal de suporte a decisao em renda variavel na B3. Descritivo, nao prescritivo."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "streamlit>=1.33",
    "requests>=2.31",
    "PyYAML>=6.0",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: exige rede e acesso as fontes oficiais (CVM/B3/BCB). Desabilitado por padrao.",
]
addopts = "-m 'not live'"

[tool.setuptools]
packages = ["etl", "transform", "db", "app"]
